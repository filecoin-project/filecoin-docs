name: Check external links

on:
  pull_request:
    branches: [ main, staging, production ]

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --accept 200,429,403 --timeout 60 --retry-wait-time 15 --max-retries 10 '**/*.md'

      # Heading (#fragment) links between docs pages. Offline, so only local
      # files are checked: anchors on external pages are often added by
      # JavaScript or are SPA routes (#/...), which lychee reports as missing.
      # Runs even if the external check failed, so both reports are published.
      - name: Heading Link Checker
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments '**/*.md'
          output: lychee/fragments.md
